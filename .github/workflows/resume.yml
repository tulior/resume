name: Build Typst Resume

on:
  push:
    branches: [main]
    paths:
      - "resume.typ"
      - "fonts/**"
      - ".github/workflows/resume.yml"
  pull_request:
    paths:
      - "resume.typ"
      - "fonts/**"
      - ".github/workflows/resume.yml"
  workflow_dispatch:

# Two quick pushes can't race each other on the auto-commit step.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PDF: Tulio-Anjos-Senior-Software-Engineer-Resume.pdf
  MAX_PAGES: "2"
  # Deterministic PDF bytes: identical content -> identical file,
  # so the commit step only fires on real changes.
  SOURCE_DATE_EPOCH: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.14.2

      - name: Build A4 PDF
        shell: bash
        run: |
          set -euo pipefail
          # Use the checked-in Source Sans 3 fonts independently of the runner's system fonts.
          typst compile --ignore-system-fonts --font-path fonts resume.typ "$PDF"

      - name: Enforce page budget
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          {
            echo "### Resume build"
            echo ""
            echo "| File | Pages | Size |"
            echo "|------|-------|------|"
          } >> "$GITHUB_STEP_SUMMARY"
          test -s "$PDF"
          pages=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          size=$(du -h "$PDF" | cut -f1)
          echo "| $PDF | $pages | $size |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$pages" -gt "$MAX_PAGES" ]; then
            echo "::error file=resume.typ::$PDF overflowed to $pages pages (budget: $MAX_PAGES). Tighten the spacing scale or cut content."
            exit 1
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: resume-pdfs
          path: ${{ env.PDF }}
          if-no-files-found: error

      - name: Commit generated PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -- "$PDF"
          if ! git diff --cached --quiet; then
            git commit -m "Update resume PDF via Typst CLI [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
