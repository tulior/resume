name: Build Typst Resume

on:
  push:
    branches: [main]
    paths:
      - "resume.typ"
      - "fonts/**"
      - ".github/workflows/resume.yml"
  pull_request:
    paths:
      - "resume.typ"
      - "fonts/**"
      - ".github/workflows/resume.yml"
  workflow_dispatch:

# Prefer the newest run for each ref. The publish push also checks ancestry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PDF: Tulio-Anjos-Senior-Software-Engineer-Resume.pdf
  # Keep the build timestamp fixed so repeated builds produce the same PDF and checksum.
  SOURCE_DATE_EPOCH: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Build A4 PDF
        shell: bash
        run: |
          set -euo pipefail
          # Use the checked-in Source Sans 3 fonts independently of the runner's system fonts.
          typst compile --ignore-system-fonts --font-path fonts resume.typ "$PDF"

      - name: Install xxHash
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xxhash

      - name: Generate PDF checksum
        shell: bash
        run: |
          set -euo pipefail
          xxh128sum -- "$PDF" > "$PDF.xxh128"

      - name: Upload PDF and checksum
        uses: actions/upload-artifact@v7
        with:
          name: resume-pdfs
          path: |
            ${{ env.PDF }}
            ${{ env.PDF }}.xxh128
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout built revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download PDF and checksum
        uses: actions/download-artifact@v8
        with:
          name: resume-pdfs
          path: ${{ runner.temp }}/resume-pdfs

      - name: Commit generated PDF and checksum
        shell: bash
        run: |
          set -euo pipefail
          cp -- "$RUNNER_TEMP/resume-pdfs/$PDF" "$RUNNER_TEMP/resume-pdfs/$PDF.xxh128" .
          git add -- "$PDF" "$PDF.xxh128"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git commit -m "Update resume PDF and checksum [skip ci]"
            git push origin HEAD:refs/heads/main
          else
            echo "No changes to commit."
          fi
